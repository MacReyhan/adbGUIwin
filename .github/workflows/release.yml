name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.1)'
        required: true
        default: '0.1.1'

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm, mingw, clang

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            echo "tag=v${{ github.event.inputs.version }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            echo "name=v${{ github.event.inputs.version }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            echo "tag=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            echo "name=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Build Tauri
        run: pnpm tauri build

      - name: List artifacts
        shell: pwsh
        run: |
          echo "=== MSI Files ==="
          Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | ForEach-Object { Write-Host $_.FullName }
          echo ""
          echo "=== NSIS Files ==="
          Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | ForEach-Object { Write-Host $_.FullName }

      - name: Upload MSI artifact
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: src-tauri/target/release/bundle/msi/ADB Manager_0.1.0_x64_en-US.msi
          asset_name: ADB Manager_0.1.0_x64_en-US.msi
          asset_content_type: application/octet-stream

      - name: Upload NSIS artifact
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: src-tauri/target/release/bundle/nsis/ADB Manager_0.1.0_x64-setup.exe
          asset_name: ADB Manager_0.1.0_x64-setup.exe
          asset_content_type: application/octet-stream

      - name: Upload MSI zip
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: src-tauri/target/release/bundle/msi/ADB Manager_0.1.0_x64_en-US.msi.zip
          asset_name: ADB Manager_0.1.0_x64_en-US.msi.zip
          asset_content_type: application/zip

      - name: Upload NSIS zip
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: src-tauri/target/release/bundle/nsis/ADB Manager_0.1.0_x64-setup.nsis.zip
          asset_name: ADB Manager_0.1.0_x64-setup.nsis.zip
          asset_content_type: application/zip

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          release_name: 'ADB Manager ${{ steps.version.outputs.name }}'
          body: |
            ## 📥 Downloads

            - **`.msi`** — Windows MSI installer (recommended)
            - **`.exe`** — NSIS setup installer

            ## ✨ What's Included

            - ADB device manager with multi-device support
            - DPI control (presets + custom)
            - APK installer
            - Scrcpy with full settings panel
            - Reboot menu (Normal/Recovery/Bootloader/Fastboot)
            - Smart binary detection (uses system ADB)

            ---
            Built with Tauri 2 + React
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/msi/ADB Manager_0.1.0_x64_en-US.msi
            src-tauri/target/release/bundle/nsis/ADB Manager_0.1.0_x64-setup.exe
            src-tauri/target/release/bundle/msi/ADB Manager_0.1.0_x64_en-US.msi.zip
            src-tauri/target/release/bundle/nsis/ADB Manager_0.1.0_x64-setup.nsis.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}