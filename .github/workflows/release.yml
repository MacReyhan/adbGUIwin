name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.0)'
        required: true
        default: '0.2.0'

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "tag=v${{ github.event.inputs.version }}" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8
            "version=${{ github.event.inputs.version }}" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8
          } else {
            "tag=${{ github.ref_name }}" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8
            $ver = "${{ github.ref_name }}" -replace '^v', ''
            "version=$ver" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8
          }

      - name: Build Tauri
        run: pnpm tauri build

      - name: Create Release with Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          release_name: 'ADB Manager ${{ steps.version.outputs.tag }}'
          body: |
            ## 📥 Downloads

            - **`.msi`** — Windows MSI installer (recommended)
            - **`.exe`** — NSIS setup installer

            ## ✨ What's Included

            - ADB device manager with multi-device support
            - DPI control (presets + custom)
            - APK installer
            - Scrcpy with full settings panel & Virtual Display (`--new-display` 720p/1080p/2k)
            - Reboot menu (Normal/Recovery/Bootloader/Fastboot)
            - Smart binary detection (uses system ADB)

            ---
            Built with Tauri 2 + React
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/msi/ADB Manager_${{ steps.version.outputs.version }}_x64_en-US.msi
            src-tauri/target/release/bundle/nsis/ADB Manager_${{ steps.version.outputs.version }}_x64-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}