name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ADB Manager ${{ github.ref_name }}'
          releaseBody: |
            ## ADB Manager ${{ github.ref_name }}
            
            ### 📥 Downloads
            - **`.msi`** — Windows installer (recommended)
            - **`.exe`** — NSIS setup installer
            
            ### ✨ Features
            - ADB device manager
            - DPI control
            - APK installer
            - Scrcpy with custom settings
            - Reboot menu
            
            Bundled with ADB + scrcpy — no extra installs needed!
          releaseDraft: false
          prerelease: false