name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.1)'
        required: true
        default: '0.1.1'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            echo "tag=v${{ github.event.inputs.version }}" >> $env:GITHUB_OUTPUT
            echo "name=v${{ github.event.inputs.version }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
            echo "name=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          }

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: 'ADB Manager ${{ steps.version.outputs.name }}'
          releaseBody: |
            ## 📥 Downloads
            
            - **`.msi`** — Windows MSI installer (recommended)
            - **`.exe`** — NSIS setup installer
            
            ## ✨ What's Included
            
            - ADB device manager with multi-device support
            - DPI control (presets + custom)
            - APK installer
            - Scrcpy with full settings panel
            - Reboot menu (Normal/Recovery/Bootloader/Fastboot)
            - Smart binary detection (uses system ADB)
            
            ---
            Built with [Arena.ai](https://arena.ai/) + Claude
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          includeDebug: false
          includeRelease: true